name: AI Digest

on:
  schedule:
    # 평일 10:00 KST = 01:00 UTC
    - cron: "0 1 * * 1-5"
  workflow_dispatch: # 수동 실행용

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      # 한국 공휴일이면 그냥 건너뛴다.
      # 평일에 걸리는 날만 적으면 된다 (cron이 월~금에만 돌기 때문).
      # 새해가 오면 다음 해 날짜를 여기에 채워 넣어야 한다.
      - name: 공휴일이면 건너뛰기
        id: holiday
        run: |
          HOLIDAYS="
          2026-09-24 추석연휴
          2026-09-25 추석
          2026-10-05 개천절대체공휴일
          2026-10-09 한글날
          2026-12-25 크리스마스
          "
          TODAY=$(TZ=Asia/Seoul date +%F)
          NAME=$(echo "$HOLIDAYS" | awk -v d="$TODAY" '$1 == d { print $2 }')
          if [ -n "$NAME" ]; then
            echo "$TODAY 은 $NAME 이라 실행하지 않는다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "$TODAY 은 공휴일이 아니다."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.holiday.outputs.skip == 'false'

      - uses: actions/setup-node@v4
        if: steps.holiday.outputs.skip == 'false'
        with:
          node-version: 20

      - run: npm install
        if: steps.holiday.outputs.skip == 'false'

      - run: npm run digest
        if: steps.holiday.outputs.skip == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
